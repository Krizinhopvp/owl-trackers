
name: Build and Deploy Owl Trackers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build -- --base=/owl-trackers/

      - name: Prepare manifest paths
        run: |
          node -e '
          const fs = require("fs");
          const p = "dist/manifest.json";
          const m = JSON.parse(fs.readFileSync(p, "utf8"));
          const base = "https://krizinhopvp.github.io/owl-trackers";
          m.icon = base + "/owl-trackers-logo.svg";
          m.background_url = base + "/src/background/background.html";
          m.action.icon = base + "/owl-trackers-logo-outline.svg";
          m.action.popover = base + "/src/action/action.html";
          fs.writeFileSync(p, JSON.stringify(m, null, 2));

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
